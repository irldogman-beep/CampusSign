name: CampusSign Android (Student + Staff debug APKs)

on:
  workflow_dispatch:
  push:
    branches: [feature/android-app-foundation, feature/student-staff-spaces-and-branding]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [student, staff]
    env:
      CAMPUSSIGN_APP: ${{ matrix.app }}
      VITE_CAMPUSSIGN_APP: ${{ matrix.app }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Install dependencies
        run: npm install
      - name: Build focused web application
        run: npm run build
      - name: Generate dedicated Android project
        run: npx cap add android
      - name: Declare native camera and location permissions
        run: node .github/scripts/configure-android.mjs
      - name: Sync web assets into Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload focused APK
        uses: actions/upload-artifact@v4
        with:
          name: campussign-android-${{ matrix.app }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
