name: CampusSign CI

on:
  pull_request:
    branches: [main] # validate final workspace sidebar layout and source archive
  push:
    branches: [main, "fix/**", "feature/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Package reviewable source archive
        if: always()
        run: git archive --format=zip --output=CampusSign-source.zip HEAD
      - name: Upload source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampusSign-source-review
          path: CampusSign-source.zip
          if-no-files-found: error
          retention-days: 14
