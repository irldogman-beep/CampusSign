name: CampusSign CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "feature/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Production build
        run: npm run build
